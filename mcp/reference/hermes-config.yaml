    chatterbox:
      type: command
      command: /home/notjitin/.hermes/chatterbox-tts/speak.sh {input_path} {output_path} {voice}
      output_format: wav
      timeout: 120
      voice_compatible: true
      warm_command: curl -s -X POST http://127.0.0.1:8790/load
      release_command: curl -s -X POST http://127.0.0.1:8790/unload
      voice: jitin-voice.wav
